<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,500;0,700;1,500&family=Manrope:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5e1c26">
<title>Sillia - لوحة الإدارة</title>
<style>
:root{--bg:#f7f2eb;--ink:#1f1915;--muted:#6b6055;--line:#e4dacb;--card:#fffdf9;--deep:#5e1c26;--sand:#efe4d4;--stone:#e0d3bf;--gold:#b08a4f;--ok:#1f7a4c;--warn:#9a5b13;--err:#9b2c2c}
:root[data-theme="dark"]{--bg:#15110f;--ink:#f2ebe0;--muted:#a09384;--line:#3a322c;--card:#201a17;--deep:#d6b67e;--sand:#1f1915;--stone:#2a221d;--gold:#d6b67e;--ok:#48b87e;--warn:#eab052;--err:#f09595}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic","Manrope",system-ui,sans-serif;line-height:1.65}
.latin{font-family:"Bodoni Moda",Didot,serif}
button,input,select,textarea{font:inherit}
button,.tab,.pill,.btn,.icon-btn{
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent
}
header{display:flex;justify-content:space-between;align-items:center;padding:16px 22px;border-bottom:1px solid var(--line);background:var(--card);flex-wrap:wrap;gap:12px;position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:baseline;gap:10px}
.logo{font-family:"Bodoni Moda",Didot,serif;font-size:24px;letter-spacing:6px;font-weight:700;color:var(--deep)}
.brand small{color:var(--muted);font-size:13px}
.tabs{display:flex;gap:8px;align-items:center}
.tab{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:7px 16px;cursor:pointer;font-size:14px}
.tab.on{background:var(--deep);color:var(--bg);border-color:var(--deep);font-weight:600}
.h-actions{display:flex;gap:8px;align-items:center}
.icon-btn,.link-btn{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:7px 13px;font-size:13px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.icon-btn:hover,.link-btn:hover{background:var(--sand)}

.wrap{max-width:1180px;margin:0 auto;padding:26px 20px 64px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:24px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.stat small{color:var(--muted);font-size:12px;display:block}
.stat b{font-size:24px;color:var(--deep);font-weight:700;display:block;margin-top:4px}

.toolbar{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-bottom:18px}
.filters{display:flex;flex-wrap:wrap;gap:8px}
.pill{border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;padding:6px 13px;font-size:13px;cursor:pointer}
.pill.on{border-color:var(--gold);background:var(--sand);color:var(--ink);font-weight:600}
.search{min-width:240px;flex:1;max-width:340px;padding:9px 14px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);font-size:14px}

.orders-list{display:flex;flex-direction:column;gap:14px}
.order-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.order-top{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px;border-bottom:1px solid var(--line);padding-bottom:12px}
.order-ref{font-family:"Bodoni Moda",Didot,serif;font-size:18px;font-weight:700;color:var(--deep);letter-spacing:1px}
.order-meta{color:var(--muted);font-size:13px;margin-top:2px}
.badge{display:inline-block;padding:3px 11px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid var(--line);background:var(--sand)}
.st-new{color:var(--warn);border-color:var(--gold)}
.st-prep{color:var(--deep);border-color:var(--deep)}
.st-done{color:var(--ok);border-color:var(--ok)}
.st-cancel{color:var(--err);border-color:var(--err)}

.order-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:16px;font-size:14px}
@media (max-width:760px){.order-grid{grid-template-columns:1fr}}
.box{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.box b{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.items-ul{margin:0;padding:0 18px 0 0;line-height:1.8}
.order-foot{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;padding-top:6px}
.order-total{font-size:16px;font-weight:700;color:var(--deep)}
.act-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.act-row select{padding:7px 12px;border:1px solid var(--line);border-radius:999px;background:var(--bg);color:var(--ink);font-size:13px;cursor:pointer}
.btn{border:0;border-radius:999px;padding:8px 15px;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.btn-primary{background:var(--deep);color:var(--bg)}
.btn-wa{background:#1f7a4c;color:#fff}
.btn-ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn-ghost:hover{background:var(--sand)}
.btn-danger{background:transparent;border:1px solid var(--err);color:var(--err)}
.btn-danger:hover{background:var(--err);color:#fff}

.p-layout{display:grid;grid-template-columns:360px 1fr;gap:22px;align-items:start}
@media (max-width:900px){.p-layout{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px}
.panel h2{margin:0 0 14px;font-size:18px;font-weight:600}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-grid .full{grid-column:1/-1}
label.fld{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted)}
.fld input,.fld select,.fld textarea{padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-size:14px}
.fld textarea{min-height:70px;resize:vertical}
.chk-row{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink);cursor:pointer;padding-top:4px}
.preview-box{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--bg);display:flex;align-items:center;gap:12px;margin-top:6px}
.preview-thumb{width:58px;height:58px;border-radius:12px;overflow:hidden;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.preview-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.form-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}

.p-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.p-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px}
.p-img{aspect-ratio:1/1;border-radius:12px;overflow:hidden;border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.p-img img{width:100%;height:100%;object-fit:cover;display:block}
.p-name{font-family:"Bodoni Moda",Didot,serif;font-size:18px;font-weight:600}
.p-sub{color:var(--muted);font-size:12px}
.p-price{font-weight:700;color:var(--deep);font-size:15px}
.p-stock{font-size:12px;font-weight:600}
.in-stock{color:var(--ok)}
.out-stock{color:var(--err)}
.p-btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:6px}

.empty{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:34px 20px;text-align:center;color:var(--muted)}
.toast{position:fixed;bottom:20px;left:20px;z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:13px;opacity:0;transform:translateY(10px);transition:opacity .25s ease,transform .25s ease;pointer-events:none}
.toast.show{opacity:1;transform:none}
[hidden]{display:none!important}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo latin">SILLIA</div>
    <small>لوحة الإدارة</small>
  </div>
  <nav class="tabs">
    <button class="tab on" data-view="orders" type="button">الطلبات</button>
    <button class="tab" data-view="perfumes" type="button">العطور والمخزون</button>
  </nav>
  <div class="h-actions">
    <a class="link-btn" href="./index.html" target="_blank" rel="noopener">عرض المتجر</a>
    <button class="icon-btn" id="themeBtn" type="button" aria-label="تبديل المظهر">المظهر</button>
  </div>
</header>

<main class="wrap">
  <section class="stats">
    <div class="stat"><small>إجمالي الطلبات</small><b id="stTotalOrders">0</b></div>
    <div class="stat"><small>طلبات جديدة</small><b id="stNewOrders">0</b></div>
    <div class="stat"><small>إجمالي المبيعات (غير الملغاة)</small><b id="stRevenue">0 د.ل</b></div>
    <div class="stat"><small>العطور المتوفرة</small><b id="stStockCount">0</b></div>
  </section>

  <!-- قسم الطلبات -->
  <section id="viewOrders">
    <div class="toolbar">
      <div class="filters" id="statusFilters">
        <button class="pill on" data-st="all" type="button">الكل</button>
        <button class="pill" data-st="new" type="button">جديد</button>
        <button class="pill" data-st="preparing" type="button">قيد التجهيز</button>
        <button class="pill" data-st="delivered" type="button">تم التوصيل</button>
        <button class="pill" data-st="cancelled" type="button">ملغي</button>
      </div>
      <input class="search" id="orderSearch" type="search" placeholder="ابحث برقم الطلب، الاسم، الهاتف، أو المدينة...">
    </div>
    <div class="orders-list" id="ordersList">
      <div class="empty">جاري تحميل الطلبات...</div>
    </div>
  </section>

  <!-- قسم العطور والمخزون -->
  <section id="viewPerfumes" hidden>
    <div class="p-layout">
      <form class="panel" id="perfumeForm">
        <h2 id="formTitle">إضافة عطر جديد</h2>
        <div class="form-grid">
          <label class="fld">اسم العطر
            <input name="name" required placeholder="مثال: Oud Satin Mood">
          </label>
          <label class="fld">الدار / العلامة
            <input name="house" placeholder="مثال: Maison Francis Kurkdjian">
          </label>
          <label class="fld">القسم
            <select name="category" required>
              <option value="niche">نيش (niche)</option>
              <option value="designer">ديزاينر (designer)</option>
              <option value="alt">بدائل (alt)</option>
              <option value="bakhoor">بخور (bakhoor)</option>
            </select>
          </label>
          <label class="fld">الفئة
            <select name="gender">
              <option value="">غير محدد</option>
              <option value="unisex">للجنسين</option>
              <option value="men">رجالي</option>
              <option value="women">نسائي</option>
            </select>
          </label>
          <label class="fld">الحجم
            <input name="size" value="100 مل" placeholder="100 مل">
          </label>
          <label class="fld">السعر (د.ل)
            <input name="price" type="number" min="0" step="1" required placeholder="250">
          </label>
          <label class="fld">النفحات المختصرة
            <input name="notes" placeholder="ورد · عنبر · عود">
          </label>
          <label class="fld">لون الزجاجة الافتراضي
            <input name="tone" type="color" value="#b08a4f" style="height:40px;padding:4px">
          </label>
          <label class="fld">افتتاحية العطر (أعلى)
            <input name="topNote" placeholder="بنفسج">
          </label>
          <label class="fld">قلب العطر
            <input name="heartNote" placeholder="ورد بلغاري">
          </label>
          <label class="fld">قاعدة العطر
            <input name="baseNote" placeholder="فانيليا وعنبر">
          </label>
          <label class="fld">رابط الصورة (URL)
            <input name="image" type="url" placeholder="https://...">
          </label>
          <label class="fld full">وصف / أثر العطر
            <textarea name="description" placeholder="وصف مختصر لأثر العطر ومناسباته..."></textarea>
          </label>
          <label class="chk-row full">
            <input type="checkbox" name="inStock" checked>
            <span>متوفر في المخزون (ظاهر للزبائن)</span>
          </label>
        </div>

        <div class="preview-box">
          <div class="preview-thumb" id="imgPreviewBox" style="background:var(--sand)">
            <span style="font-size:11px;color:var(--muted)">معاينة</span>
          </div>
          <div style="font-size:12px;color:var(--muted)">
            <b style="display:block;color:var(--ink)">معاينة رابط الصورة</b>
            يظهر هنا شكل الصورة عند إدخال رابط صحيح.
          </div>
        </div>

        <div class="form-actions">
          <button class="btn btn-primary" type="submit" id="savePerfumeBtn">حفظ العطر</button>
          <button class="btn btn-ghost" type="button" id="resetFormBtn">إلغاء / جديد</button>
        </div>
      </form>

      <div>
        <div class="toolbar">
          <div class="filters" id="catFilters">
            <button class="pill on" data-cat="all" type="button">كل الأقسام</button>
            <button class="pill" data-cat="niche" type="button">نيش</button>
            <button class="pill" data-cat="designer" type="button">ديزاينر</button>
            <button class="pill" data-cat="alt" type="button">بدائل</button>
            <button class="pill" data-cat="bakhoor" type="button">بخور</button>
          </div>
          <input class="search" id="perfumeSearch" type="search" placeholder="ابحث باسم العطر أو الدار...">
        </div>
        <div class="p-list" id="perfumesList">
          <div class="empty">جاري تحميل العطور...</div>
        </div>
      </div>
    </div>
  </section>
</main>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, query, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDdICo-EAFaCJ9mvd7gT7wjKkyXCR4S2f4",
  authDomain: "sillia-aa319.firebaseapp.com",
  projectId: "sillia-aa319",
  storageBucket: "sillia-aa319.firebasestorage.app",
  messagingSenderId: "646622417573",
  appId: "1:646622417573:web:2937ded7d2d22bdd7bf34c"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

let toastTimer = null;
function showToast(msg){
  const el = $("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 2400);
}

function applyTheme(dark){
  document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
  try { localStorage.setItem("sillia_admin_theme", dark ? "dark" : "light"); } catch(_){}
  $("themeBtn").textContent = dark ? "الوضع النهاري" : "الوضع الليلي";
}
const initDark = (() => { try { return localStorage.getItem("sillia_admin_theme") === "dark"; } catch(_){ return false; } })();
applyTheme(initDark);
$("themeBtn").addEventListener("click", () => {
  applyTheme(document.documentElement.getAttribute("data-theme") !== "dark");
});

// التنقل بين التبويبات
document.querySelectorAll(".tab[data-view]").forEach(btn => {
  btn.addEventListener("click", () => {
    const v = btn.dataset.view;
    document.querySelectorAll(".tab[data-view]").forEach(b => b.classList.toggle("on", b.dataset.view === v));
    $("viewOrders").hidden = v !== "orders";
    $("viewPerfumes").hidden = v !== "perfumes";
  });
});

const STATUS_MAP = {
  new: { label: "جديد", cls: "st-new" },
  preparing: { label: "قيد التجهيز", cls: "st-prep" },
  delivered: { label: "تم التوصيل", cls: "st-done" },
  cancelled: { label: "ملغي", cls: "st-cancel" }
};

let orders = [];
let perfumes = [];
let statusFilter = "all";
let catFilter = "all";
let editingId = null;

function formatDate(ts){
  if(!ts) return "";
  const d = ts.toDate ? ts.toDate() : (ts.seconds ? new Date(ts.seconds * 1000) : new Date(ts));
  if(Number.isNaN(d.getTime())) return "";
  return d.toLocaleString("ar-LY", { dateStyle: "short", timeStyle: "short" });
}

function cleanPhoneForWa(phone){
  let p = String(phone || "").replace(/[^\d]/g, "");
  if(p.startsWith("00")) p = p.slice(2);
  if(p.startsWith("09")) p = "218" + p.slice(1);
  return p;
}

function updateStats(){
  $("stTotalOrders").textContent = orders.length;
  $("stNewOrders").textContent = orders.filter(o => (o.status || "new") === "new").length;
  const rev = orders
    .filter(o => o.status !== "cancelled")
    .reduce((sum, o) => sum + (Number(o.total) || 0), 0);
  $("stRevenue").textContent = rev + " د.ل";
  $("stStockCount").textContent = perfumes.filter(p => p.inStock !== false).length;
}

function renderOrders(){
  const q = ($("orderSearch").value || "").trim().toLowerCase();
  const list = orders.filter(o => {
    const st = o.status || "new";
    if(statusFilter !== "all" && st !== statusFilter) return false;
    if(!q) return true;
    const cust = o.customer || {};
    const hay = [o.ref, cust.name, cust.phone, cust.city, cust.address].filter(Boolean).join(" ").toLowerCase();
    return hay.includes(q);
  });

  if(!list.length){
    $("ordersList").innerHTML = '<div class="empty">لا توجد طلبات مطابقة للبحث أو الفلتر الحالي.</div>';
    return;
  }

  $("ordersList").innerHTML = list.map(o => {
    const st = o.status || "new";
    const info = STATUS_MAP[st] || STATUS_MAP.new;
    const cust = o.customer || {};
    const itemsArr = Array.isArray(o.items) ? o.items : [];
    const payTxt = o.payment === "bank" ? "تحويل مصرفي (مصرف الوحدة)" : "كاش عند الاستلام";
    const waPhone = cleanPhoneForWa(cust.phone);
    const waMsg = encodeURIComponent(`مرحباً ${cust.name || ""}، بخصوص طلبك رقم ${o.ref} من متجر Sillia.`);
    const mapLink = cust.mapUrl
      ? `<div><a href="${esc(cust.mapUrl)}" target="_blank" rel="noopener">فتح الموقع على الخريطة</a></div>`
      : "";

    return `<article class="order-card" data-oid="${esc(o.id)}">
      <div class="order-top">
        <div>
          <div class="order-ref">${esc(o.ref || o.id)}</div>
          <div class="order-meta">${esc(formatDate(o.createdAt))} · ${esc(payTxt)}</div>
        </div>
        <span class="badge ${info.cls}">${esc(info.label)}</span>
      </div>

      <div class="order-grid">
        <div class="box">
          <b>بيانات العميل والتوصيل</b>
          <div>الاسم: <strong>${esc(cust.name || "—")}</strong></div>
          <div>الهاتف: <span dir="ltr">${esc(cust.phone || "—")}</span></div>
          <div>المدينة: ${esc(cust.city || "—")}</div>
          <div>العنوان: ${esc(cust.address || "—")}</div>
          ${mapLink}
        </div>
        <div class="box">
          <b>المنتجات المطلوبة (${esc(o.count || itemsArr.length)} قطعة)</b>
          <ul class="items-ul">
            ${itemsArr.map(it => `<li>${esc(it.name)} × ${esc(it.qty)} (${esc((Number(it.price)||0) * (Number(it.qty)||1))} د.ل)</li>`).join("")}
          </ul>
        </div>
      </div>

      <div class="order-foot">
        <div class="order-total">الإجمالي: ${esc(o.total || 0)} د.ل</div>
        <div class="act-row">
          <select class="st-select" data-ost="${esc(o.id)}" aria-label="حالة الطلب">
            <option value="new" ${st === "new" ? "selected" : ""}>جديد</option>
            <option value="preparing" ${st === "preparing" ? "selected" : ""}>قيد التجهيز</option>
            <option value="delivered" ${st === "delivered" ? "selected" : ""}>تم التوصيل</option>
            <option value="cancelled" ${st === "cancelled" ? "selected" : ""}>ملغي</option>
          </select>
          ${waPhone ? `<a class="btn btn-wa" href="https://wa.me/${esc(waPhone)}?text=${waMsg}" target="_blank" rel="noopener">واتساب العميل</a>` : ""}
          <button class="btn btn-danger" data-del-order="${esc(o.id)}" type="button">حذف</button>
        </div>
      </div>
    </article>`;
  }).join("");
}

$("statusFilters").addEventListener("click", e => {
  const b = e.target.closest("button[data-st]");
  if(!b) return;
  statusFilter = b.dataset.st;
  document.querySelectorAll("#statusFilters .pill").forEach(x => x.classList.toggle("on", x.dataset.st === statusFilter));
  renderOrders();
});
$("orderSearch").addEventListener("input", renderOrders);

$("ordersList").addEventListener("change", async e => {
  const sel = e.target.closest("select[data-ost]");
  if(!sel) return;
  try {
    await updateDoc(doc(db, "orders", sel.dataset.ost), { status: sel.value });
    showToast("تم تحديث حالة الطلب");
  } catch(err){
    console.error(err);
    showToast("تعذر تحديث حالة الطلب");
  }
});

$("ordersList").addEventListener("click", async e => {
  const delBtn = e.target.closest("button[data-del-order]");
  if(!delBtn) return;
  if(!confirm("هل أنت متأكد من حذف هذا الطلب؟")) return;
  try {
    await deleteDoc(doc(db, "orders", delBtn.dataset.delOrder));
    showToast("تم حذف الطلب");
  } catch(err){
    console.error(err);
    showToast("تعذر حذف الطلب");
  }
});

// معاينة صورة العطر في النموذج
const form = $("perfumeForm");
function syncPreview(){
  const url = (form.elements.image.value || "").trim();
  const box = $("imgPreviewBox");
  if(!url){
    box.innerHTML = '<span style="font-size:11px;color:var(--muted)">معاينة</span>';
    return;
  }
  box.innerHTML = `<img src="${esc(url)}" alt="معاينة" onerror="this.parentElement.innerHTML='<span style=font-size:10px;color:var(--err)>رابط غير صالح</span>'">`;
}
form.elements.image.addEventListener("input", syncPreview);

function resetPerfumeForm(){
  editingId = null;
  form.reset();
  form.elements.size.value = "100 مل";
  form.elements.tone.value = "#b08a4f";
  form.elements.inStock.checked = true;
  $("formTitle").textContent = "إضافة عطر جديد";
  $("savePerfumeBtn").textContent = "حفظ العطر";
  syncPreview();
}
$("resetFormBtn").addEventListener("click", resetPerfumeForm);

form.addEventListener("submit", async e => {
  e.preventDefault();
  const btn = $("savePerfumeBtn");
  btn.disabled = true;
  const f = new FormData(form);
  const topNote = (f.get("topNote") || "").trim();
  const heartNote = (f.get("heartNote") || "").trim();
  const baseNote = (f.get("baseNote") || "").trim();
  const rawNotes = (f.get("notes") || "").trim();
  const notes = rawNotes || [topNote, heartNote, baseNote].filter(Boolean).join(" · ");

  const payload = {
    name: (f.get("name") || "").trim(),
    house: (f.get("house") || "").trim() || "Sillia",
    category: f.get("category") || "niche",
    gender: f.get("gender") || "",
    size: (f.get("size") || "").trim() || "100 مل",
    price: Number(f.get("price")) || 0,
    notes,
    topNote,
    heartNote,
    baseNote,
    tone: f.get("tone") || "#b08a4f",
    image: (f.get("image") || "").trim(),
    description: (f.get("description") || "").trim(),
    inStock: form.elements.inStock.checked
  };

  try {
    if(editingId){
      await updateDoc(doc(db, "perfumes", editingId), payload);
      showToast("تم تحديث العطر");
    } else {
      payload.createdAt = serverTimestamp();
      await addDoc(collection(db, "perfumes"), payload);
      showToast("تمت إضافة العطر");
    }
    resetPerfumeForm();
  } catch(err){
    console.error(err);
    showToast("تعذر حفظ العطر");
  } finally {
    btn.disabled = false;
  }
});

function renderPerfumes(){
  const q = ($("perfumeSearch").value || "").trim().toLowerCase();
  const list = perfumes.filter(p => {
    if(catFilter !== "all" && p.category !== catFilter) return false;
    if(!q) return true;
    return [p.name, p.house, p.notes].filter(Boolean).join(" ").toLowerCase().includes(q);
  });

  if(!list.length){
    $("perfumesList").innerHTML = '<div class="empty">لا توجد عطور مطابقة للعرض.</div>';
    return;
  }

  $("perfumesList").innerHTML = list.map(p => {
    const tone = /^#[0-9a-fA-F]{3,8}$/.test(p.tone || "") ? p.tone : "#b08a4f";
    const available = p.inStock !== false;
    const imgHtml = p.image
      ? `<img src="${esc(p.image)}" alt="${esc(p.name)}" loading="lazy" onerror="this.style.display='none'">`
      : `<span style="font-size:12px;color:var(--muted)">بدون صورة</span>`;

    return `<article class="p-card" data-pid="${esc(p.id)}">
      <div class="p-img" style="background:linear-gradient(160deg,${esc(tone)}55,${esc(tone)}20)">${imgHtml}</div>
      <div class="p-name">${esc(p.name)}</div>
      <div class="p-sub">${esc(p.house)} · ${esc(p.category)} · ${esc(p.size)}</div>
      <div class="p-price">${esc(p.price)} د.ل</div>
      <div class="p-stock ${available ? "in-stock" : "out-stock"}">${available ? "متوفر في المخزون" : "غير متوفر"}</div>
      <div class="p-btns">
        <button class="btn btn-ghost" data-edit-p="${esc(p.id)}" type="button">تعديل</button>
        <button class="btn btn-ghost" data-toggle-p="${esc(p.id)}" type="button">${available ? "إخفاء / نفد" : "تفعيل التوفر"}</button>
        <button class="btn btn-danger" data-del-p="${esc(p.id)}" type="button">حذف</button>
      </div>
    </article>`;
  }).join("");
}

$("catFilters").addEventListener("click", e => {
  const b = e.target.closest("button[data-cat]");
  if(!b) return;
  catFilter = b.dataset.cat;
  document.querySelectorAll("#catFilters .pill").forEach(x => x.classList.toggle("on", x.dataset.cat === catFilter));
  renderPerfumes();
});
$("perfumeSearch").addEventListener("input", renderPerfumes);

$("perfumesList").addEventListener("click", async e => {
  const editBtn = e.target.closest("button[data-edit-p]");
  if(editBtn){
    const p = perfumes.find(x => x.id === editBtn.dataset.editP);
    if(!p) return;
    editingId = p.id;
    form.elements.name.value = p.name || "";
    form.elements.house.value = p.house || "";
    form.elements.category.value = p.category || "niche";
    form.elements.gender.value = p.gender || "";
    form.elements.size.value = p.size || "100 مل";
    form.elements.price.value = p.price ?? 0;
    form.elements.notes.value = p.notes || "";
    form.elements.topNote.value = p.topNote || "";
    form.elements.heartNote.value = p.heartNote || "";
    form.elements.baseNote.value = p.baseNote || "";
    form.elements.image.value = p.image || "";
    form.elements.description.value = p.description || "";
    form.elements.tone.value = /^#[0-9a-fA-F]{6}$/.test(p.tone || "") ? p.tone : "#b08a4f";
    form.elements.inStock.checked = p.inStock !== false;
    $("formTitle").textContent = "تعديل عطر: " + (p.name || "");
    $("savePerfumeBtn").textContent = "تحديث العطر";
    syncPreview();
    form.scrollIntoView({ behavior: "smooth", block: "start" });
    return;
  }

  const toggleBtn = e.target.closest("button[data-toggle-p]");
  if(toggleBtn){
    const p = perfumes.find(x => x.id === toggleBtn.dataset.toggleP);
    if(!p) return;
    try {
      await updateDoc(doc(db, "perfumes", p.id), { inStock: p.inStock === false });
      showToast("تم تحديث حالة التوفر");
    } catch(err){
      console.error(err);
      showToast("تعذر تحديث حالة التوفر");
    }
    return;
  }

  const delBtn = e.target.closest("button[data-del-p]");
  if(delBtn){
    if(!confirm("هل أنت متأكد من حذف هذا العطر من المتجر؟")) return;
    try {
      await deleteDoc(doc(db, "perfumes", delBtn.dataset.delP));
      if(editingId === delBtn.dataset.delP) resetPerfumeForm();
      showToast("تم حذف العطر");
    } catch(err){
      console.error(err);
      showToast("تعذر حذف العطر");
    }
  }
});

// مزامنة مباشرة مع Firestore
onSnapshot(query(collection(db, "orders")), snap => {
  orders = snap.docs
    .map(d => ({ id: d.id, ...d.data() }))
    .sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
  updateStats();
  renderOrders();
}, err => {
  console.error(err);
  $("ordersList").innerHTML = '<div class="empty">تعذر قراءة الطلبات من Firestore.</div>';
});

onSnapshot(query(collection(db, "perfumes")), snap => {
  perfumes = snap.docs.map(d => {
    const data = d.data();
    return {
      id: d.id,
      name: data.name || "",
      house: data.house || "Sillia",
      category: data.category || data.cat || "niche",
      gender: data.gender || "",
      size: data.size || "100 مل",
      price: Number(data.price) || 0,
      notes: data.notes || "",
      topNote: data.topNote || "",
      heartNote: data.heartNote || "",
      baseNote: data.baseNote || "",
      tone: data.tone || "#b08a4f",
      image: data.image || data.imageUrl || "",
      description: data.description || "",
      inStock: data.inStock !== false
    };
  });
  updateStats();
  renderPerfumes();
}, err => {
  console.error(err);
  $("perfumesList").innerHTML = '<div class="empty">تعذر قراءة العطور من Firestore.</div>';
});
</script>
</body>
</html>
